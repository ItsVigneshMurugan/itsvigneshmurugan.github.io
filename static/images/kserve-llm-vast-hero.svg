<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="costBadge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFA500"/>
      <stop offset="1" stop-color="#FF6B35"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>

  <!-- Subtle grid background -->
  <g opacity="0.04">
    <path d="M0 0 L1200 0" stroke="#fff" stroke-width="1"/>
    <g stroke="#fff" stroke-width="0.5">
      <line x1="0" y1="80" x2="1200" y2="80"/>
      <line x1="0" y1="160" x2="1200" y2="160"/>
      <line x1="0" y1="240" x2="1200" y2="240"/>
      <line x1="0" y1="320" x2="1200" y2="320"/>
      <line x1="0" y1="400" x2="1200" y2="400"/>
      <line x1="0" y1="480" x2="1200" y2="480"/>
      <line x1="0" y1="560" x2="1200" y2="560"/>
      <line x1="120" y1="0" x2="120" y2="627"/>
      <line x1="240" y1="0" x2="240" y2="627"/>
      <line x1="360" y1="0" x2="360" y2="627"/>
      <line x1="480" y1="0" x2="480" y2="627"/>
      <line x1="600" y1="0" x2="600" y2="627"/>
      <line x1="720" y1="0" x2="720" y2="627"/>
      <line x1="840" y1="0" x2="840" y2="627"/>
      <line x1="960" y1="0" x2="960" y2="627"/>
      <line x1="1080" y1="0" x2="1080" y2="627"/>
    </g>
  </g>

  <!-- Tag pill (top) -->
  <g transform="translate(70, 70)">
    <rect x="0" y="0" width="240" height="34" rx="17" fill="#326CE5" opacity="0.15" stroke="#326CE5" stroke-width="1"/>
    <text x="120" y="22" font-size="14" fill="#7BA7E8" text-anchor="middle" font-weight="600" letter-spacing="2">
      KSERVE · VLLM · KUBERNETES
    </text>
  </g>

  <!-- Title -->
  <text x="70" y="170" font-size="54" font-weight="800" fill="#fff">
    KServe LLM Inference
  </text>
  <text x="70" y="225" font-size="54" font-weight="800" fill="#fff">
    on a <tspan fill="#76B900">Rented GPU</tspan>
  </text>

  <!-- Subtitle -->
  <text x="70" y="275" font-size="22" fill="#8b949e" font-weight="400">
    Vast.ai VM &#8594; k3s &#8594; KServe Standard mode &#8594; Qwen 2.5 on vLLM
  </text>

  <!-- Flow diagram -->
  <g transform="translate(70, 340)">
    <!-- Box 1: Vast.ai -->
    <g>
      <rect x="0" y="0" width="180" height="100" rx="10" fill="#161b22" stroke="#326CE5" stroke-width="2"/>
      <text x="90" y="40" font-size="14" fill="#7BA7E8" text-anchor="middle" font-weight="600" letter-spacing="1">VAST.AI VM</text>
      <text x="90" y="65" font-size="13" fill="#8b949e" text-anchor="middle">Ubuntu 22.04</text>
      <text x="90" y="85" font-size="13" fill="#8b949e" text-anchor="middle">RTX 5060 8GB</text>
    </g>

    <!-- Arrow 1 -->
    <g transform="translate(195, 50)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#484f58" stroke-width="2"/>
      <polygon points="35,-6 47,0 35,6" fill="#484f58"/>
    </g>

    <!-- Box 2: k3s -->
    <g transform="translate(250, 0)">
      <rect x="0" y="0" width="180" height="100" rx="10" fill="#161b22" stroke="#326CE5" stroke-width="2"/>
      <text x="90" y="40" font-size="14" fill="#7BA7E8" text-anchor="middle" font-weight="600" letter-spacing="1">K3S</text>
      <text x="90" y="65" font-size="13" fill="#8b949e" text-anchor="middle">single-node</text>
      <text x="90" y="85" font-size="13" fill="#8b949e" text-anchor="middle">nvidia.com/gpu: 1</text>
    </g>

    <!-- Arrow 2 -->
    <g transform="translate(445, 50)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#484f58" stroke-width="2"/>
      <polygon points="35,-6 47,0 35,6" fill="#484f58"/>
    </g>

    <!-- Box 3: KServe -->
    <g transform="translate(500, 0)">
      <rect x="0" y="0" width="180" height="100" rx="10" fill="#161b22" stroke="#326CE5" stroke-width="2"/>
      <text x="90" y="40" font-size="14" fill="#7BA7E8" text-anchor="middle" font-weight="600" letter-spacing="1">KSERVE</text>
      <text x="90" y="65" font-size="13" fill="#8b949e" text-anchor="middle">RawDeployment</text>
      <text x="90" y="85" font-size="13" fill="#8b949e" text-anchor="middle">InferenceService</text>
    </g>

    <!-- Arrow 3 -->
    <g transform="translate(695, 50)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#484f58" stroke-width="2"/>
      <polygon points="35,-6 47,0 35,6" fill="#484f58"/>
    </g>

    <!-- Box 4: vLLM + Qwen (highlighted) -->
    <g transform="translate(750, 0)">
      <rect x="0" y="0" width="220" height="100" rx="10" fill="#161b22" stroke="#76B900" stroke-width="2" filter="url(#glow)"/>
      <text x="110" y="40" font-size="14" fill="#9FD938" text-anchor="middle" font-weight="600" letter-spacing="1">VLLM + QWEN 2.5</text>
      <text x="110" y="65" font-size="13" fill="#8b949e" text-anchor="middle">0.5B-Instruct</text>
      <text x="110" y="85" font-size="13" fill="#8b949e" text-anchor="middle">OpenAI-compatible API</text>
    </g>
  </g>

  <!-- Cost badge -->
  <g transform="translate(70, 490)">
    <rect x="0" y="0" width="260" height="80" rx="12" fill="url(#costBadge)"/>
    <text x="20" y="32" font-size="12" fill="#fff" font-weight="700" letter-spacing="2" opacity="0.85">TOTAL COST</text>
    <text x="20" y="68" font-size="36" fill="#fff" font-weight="800">$0.24 USD</text>
  </g>

  <!-- 30 min badge -->
  <g transform="translate(350, 490)">
    <rect x="0" y="0" width="220" height="80" rx="12" fill="#0f1923" stroke="#326CE5" stroke-width="2"/>
    <text x="20" y="32" font-size="12" fill="#7BA7E8" font-weight="700" letter-spacing="2">END-TO-END</text>
    <text x="20" y="68" font-size="36" fill="#fff" font-weight="800">~30 min</text>
  </g>

</svg>
